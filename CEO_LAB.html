<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEO LAB | 実践経営シミュレーター</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#e9eef6;background:#0d1522}*{box-sizing:border-box}body{margin:0}header{padding:20px max(18px,calc((100vw - 1120px)/2));background:#152238;border-bottom:1px solid #2c3b50;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.09em;font-size:21px}.sub{color:#9eafc4;font-size:12px}.wrap{max-width:1120px;margin:auto;padding:22px 16px 65px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.panel,.metric{background:#172438;border:1px solid #314157;border-radius:15px;padding:19px}.metric small{display:block;color:#9eafc4;margin-bottom:8px}.metric strong{font-size:23px;font-variant-numeric:tabular-nums}.red{color:#ff9a94}.green{color:#7de0b3}h1{font-size:24px;margin:8px 0 10px}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.75;color:#d2dcea}label{display:block;margin:13px 0 6px;font-weight:700;font-size:14px}input,select{background:#0e1929;border:1px solid #4c607a;border-radius:9px;padding:11px;color:#fff;width:100%;font-size:16px}button{background:#66c3b0;color:#081b1a;border:0;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer}button.secondary{background:#2b3e58;color:#e9eef6}button:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:17px}.muted{color:#a6b5c9;font-size:13px}.tip{border-left:3px solid #66c3b0;padding:10px 13px;background:#203349;border-radius:4px;line-height:1.7}.warning{border-left-color:#f0b36a}.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{background:#24344b;color:#dbe5f1}.tab.active{background:#66c3b0;color:#09231f}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #35475e}td:last-child,th:last-child{text-align:right}details{margin:10px 0;border:1px solid #34475d;border-radius:9px;padding:10px 13px}summary{cursor:pointer;font-weight:700}.bar{height:7px;background:#304258;border-radius:10px;overflow:hidden}.bar>span{display:block;background:#66c3b0;height:100%}.mini{font-size:12px;color:#9eafc4}.separator{border:0;border-top:1px solid #35475e;margin:18px 0}.full{grid-column:1/-1}.notice{background:#233b4b;border-radius:10px;padding:13px;margin:12px 0}.pill{background:#2c4155;padding:5px 9px;border-radius:20px;font-size:12px}.scroll{overflow-x:auto}.intro{max-width:780px;margin:35px auto}.intro h1{font-size:33px}.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:12px 0}.check input{width:auto}.footer{font-size:12px;color:#91a5ba;margin-top:28px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.metric strong{font-size:19px}header{padding:16px}.wrap{padding:15px 12px 45px}.panel{padding:15px}}
</style></head><body><header><div><div class="brand">CEO LAB <span class="pill">EVENT BUSINESS</span></div><div class="sub">実践型・経営シミュレーター / 12か月チャレンジ</div></div><button class="secondary" onclick="restartConfirm()">最初から</button></header><main id="app" class="wrap"></main><script>
const KEY='ceolab_v1_save';const yen=n=>Math.round(n).toLocaleString('ja-JP')+'万円';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jobs=[
{name:'企業内セミナー',base:115,cost:54,days:1,rep:1,description:'少人数の企業セミナー。制作難度は低い。'},
{name:'新商品発表会',base:235,cost:137,days:2,rep:2,description:'広報向けの発表会。演出・機材・進行管理が必要。'},
{name:'企業周年イベント',base:440,cost:276,days:3,rep:3,description:'参加者300名規模。多数の外注先を管理する。'},
{name:'没入型ブランド体験',base:660,cost:455,days:4,rep:5,description:'イマーシブ演出。高い制作力と資金余力が必要。'}];
const events=[{name:'平常運転',cost:0,trust:0,desc:'今月は追加トラブルなし。'},{name:'機材の追加手配',cost:20,trust:0,desc:'会場の仕様変更で追加機材が必要。20万円の費用が発生。'},{name:'急なスタッフ欠員',cost:15,trust:-1,desc:'代替要員を手配。15万円の追加費用、信用が1低下。'},{name:'紹介につながる高評価',cost:0,trust:2,desc:'納品品質が評価され、信用が2上昇。'}];
const defaults=()=>({month:1,cash:500,receivables:[],payables:[],loan:0,profit:0,retained:0,trust:5,team:1,staffPay:27,overhead:23,founderPay:15,records:[],started:false,ended:false,loanRate:.06,mode:'standard'});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){s=defaults()};let tab='play';let feedback=null;let draft={job:0,price:115,deposit:30,payDelay:1,staff:0,loan:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function resetDraft(){draft={job:0,price:jobs[0].base,deposit:30,payDelay:1,staff:0,loan:0}}function restartConfirm(){if(confirm('進捗を消去して最初から始めますか？')){s=defaults();feedback=null;resetDraft();tab='play';save();render()}}
function n(id){return Number(document.getElementById(id)?.value||0)}
function stat(){return `<div class="grid"><div class="metric"><small>現金残高</small><strong class="${s.cash<100?'red':''}">${yen(s.cash)}</strong></div><div class="metric"><small>売掛金（未回収）</small><strong>${yen(s.receivables.reduce((a,b)=>a+b.amount,0))}</strong></div><div class="metric"><small>借入残高</small><strong>${yen(s.loan)}</strong></div><div class="metric"><small>累計営業利益</small><strong class="${s.profit<0?'red':'green'}">${yen(s.profit)}</strong></div></div>`}
function intro(){return `<section class="panel intro"><div class="pill" style="display:inline-block">BEGINNER → CEO</div><h1>社長として、12か月生き残れるか。</h1><p>あなたは企業向けイベント制作会社の創業者。案件の見積、支払条件、採用、融資、キャッシュフローを判断して経営する。<b>利益が出ても、現金が尽きればゲームオーバー。</b></p><div class="grid" style="margin:20px 0"><div class="metric"><small>初期現金</small><strong>500万円</strong></div><div class="metric"><small>社員</small><strong>1名</strong></div><div class="metric"><small>毎月固定費</small><strong>65万円</strong></div><div class="metric"><small>目標</small><strong>12か月</strong></div></div><div class="tip">初心者モード：用語解説・予測・意思決定の採点付き。案件価格と入金条件を自分で決め、毎月の決算を確認します。</div><label class="check"><input type="checkbox" id="guide" checked> 意思決定前に収支予測を表示する</label><button onclick="start()">会社を設立して開始 →</button><p class="mini">これは教育用の架空モデルです。税務・法務・会計・労務を簡略化しています。実際の経営判断には専門家への確認が必要です。</p></section>`}
function start(){s.started=true;s.mode=document.getElementById('guide').checked?'standard':'challenge';save();render()}
function getCosts(){const j=jobs[draft.job];const fixed=s.overhead+s.founderPay+s.team*s.staffPay;const price=draft.price;const deposit=Math.round(price*draft.deposit/100);const balance=price-deposit;const interest=Math.round((s.loan+draft.loan)*s.loanRate/12*100)/100;const hireCost=draft.staff*8;const newFixed=fixed+draft.staff*s.staffPay;const projectedCash=s.cash+draft.loan+deposit-j.cost-newFixed-hireCost-interest;const margin=price-j.cost-newFixed-hireCost-interest;return {j,fixed,price,deposit,balance,interest,hireCost,newFixed,projectedCash,margin}}
function play(){if(s.ended)return ending();const c=getCosts();return `<div class="cols"><section class="panel"><div class="pill" style="display:inline-block">MONTH ${s.month} / 12</div><h1>今月の経営会議</h1><p>営業担当から新規案件の相談が届きました。あなたが受注案件・見積価格・前受金・支払条件・採用・融資を決めます。会社は毎月固定費が発生します。</p><label>① 受注する案件</label><select id="job" onchange="changeJob()">${jobs.map((j,i)=>`<option value="${i}" ${draft.job===i?'selected':''}>${esc(j.name)}（相場目安 ${yen(j.base)}）</option>`).join('')}</select><p class="muted">${esc(c.j.description)}　直接制作費 ${yen(c.j.cost)}。費用は今月全額支払い。</p><label>② 顧客への見積価格（税込ではなく税抜、万円）</label><input id="price" type="number" min="1" step="5" value="${draft.price}" oninput="updateDraft()"><p class="mini">価格が市場目安より高すぎると失注リスクが上がります。</p><label>③ 契約時に受け取る前受金</label><select id="deposit" onchange="updateDraft()">${[0,30,50].map(x=>`<option value="${x}" ${draft.deposit===x?'selected':''}>${x}%</option>`).join('')}</select><label>④ 残金の回収時期</label><select id="delay" onchange="updateDraft()"><option value="1" ${draft.payDelay===1?'selected':''}>翌月末</option><option value="2" ${draft.payDelay===2?'selected':''}>翌々月末</option></select><label>⑤ 新規採用</label><select id="staff" onchange="updateDraft()"><option value="0" ${draft.staff===0?'selected':''}>採用なし</option><option value="1" ${draft.staff===1?'selected':''}>社員1名採用（採用費8万円＋月給等27万円）</option></select><label>⑥ 新規借入（万円）</label><select id="loan" onchange="updateDraft()">${[0,100,200].map(x=>`<option value="${x}" ${draft.loan===x?'selected':''}>${yen(x)}</option>`).join('')}</select><p class="mini">簡易融資：信用が低いと借入が否決されます。金利年6%、元本はゲーム期間中据置（現実の融資とは異なります）。</p><div class="actions"><button onclick="commit()">この方針で1か月経営する →</button></div></section><aside><section class="panel" id="forecast">${forecast()}</section><section class="panel" style="margin-top:16px"><h2>経営用語を学ぶ</h2><details open><summary>売上と入金の違い</summary><p>契約や納品により売上を認識しても、顧客からの入金は後日になることがあります。未回収額は売掛金です。</p></details><details><summary>営業利益とは？</summary><p>売上から制作費・人件費・家賃などの営業費用を引いた利益です。借入利息は営業外費用として別に扱います。</p></details><details><summary>運転資金とは？</summary><p>制作費や給与を先払いするために必要な現金です。売掛金が大きいほど資金繰りに注意が必要です。</p></details><details><summary>前受金とは？</summary><p>仕事の完了前に受け取るお金。原則、受領時点では売上ではなく負債として扱い、仕事の完了時に売上へ振り替えます。このゲームでは案件は月内完了します。</p></details></section></aside></div>`}
function forecast(){const c=getCosts();const receiv=s.receivables.filter(x=>x.due<=s.month).reduce((a,x)=>a+x.amount,0);const out=c.j.cost+c.newFixed+c.hireCost+c.interest;const predicted=s.cash+receiv+draft.loan+c.deposit-out;const quoteRatio=c.price/c.j.base;return `<h2>経営判断の事前予測</h2>${s.mode==='challenge'?'<p class="muted">チャレンジモード：事前予測は非表示。自分で計算しよう。</p>':`<table><tr><td>期首現金</td><td>${yen(s.cash)}</td></tr><tr><td>過去案件の回収</td><td>＋${yen(receiv)}</td></tr><tr><td>今回の前受金</td><td>＋${yen(c.deposit)}</td></tr><tr><td>新規借入</td><td>＋${yen(draft.loan)}</td></tr><tr><td>制作費・固定費等</td><td>−${yen(out)}</td></tr><tr><th>月末現金予測（受注時）</th><th class="${predicted<0?'red':'green'}">${yen(predicted)}</th></tr><tr><td>案件単体の粗利益</td><td>${yen(c.price-c.j.cost)}</td></tr><tr><td>今月の営業利益（受注時）</td><td>${yen(c.price-c.j.cost-c.newFixed-c.hireCost)}</td></tr></table><p class="mini">市場価格比 ${Math.round(quoteRatio*100)}%。実際は失注・突発費用・借入否決の可能性があります。</p>`}<div class="tip ${predicted<0?'warning':''}">${predicted<0?'この契約条件では受注できても支払い資金が不足する可能性があります。':'経営者は利益だけでなく、入金の時期と現金残高を確認しましょう。'}</div>`}
function changeJob(){draft.job=n('job');draft.price=jobs[draft.job].base;document.getElementById('price').value=draft.price;updateDraft()}
function updateDraft(){draft.price=n('price');draft.deposit=n('deposit');draft.payDelay=n('delay');draft.staff=n('staff');draft.loan=n('loan');document.getElementById('forecast').innerHTML=forecast()}
function randEvent(month){return events[(month*7+3)%events.length]}
function commit(){updateDraft();if(draft.price<=0||draft.price>10000){alert('見積価格を1〜10000万円に設定してください。');return}const c=getCosts();const startCash=s.cash;const due=s.receivables.filter(x=>x.due<=s.month).reduce((a,x)=>a+x.amount,0);s.receivables=s.receivables.filter(x=>x.due>s.month);s.cash+=due;let approvedLoan=draft.loan;if(s.trust<3&&approvedLoan>0)approvedLoan=0;s.loan+=approvedLoan;s.cash+=approvedLoan;const priceRatio=draft.price/c.j.base;const win=priceRatio<=1.12||(priceRatio<=1.3&&s.trust>=8);const capacity=s.team+draft.staff+1;const overloaded=c.j.days>capacity;const event=win?randEvent(s.month):events[0];let revenue=0,direct=0,deposit=0,extra=0,trustDelta=0;let notes=[];
if(win){revenue=draft.price;direct=c.j.cost;deposit=c.deposit;s.cash+=deposit;s.receivables.push({amount:c.balance,due:s.month+draft.payDelay});extra=event.cost+(overloaded?35:0);trustDelta=c.j.rep+event.trust-(overloaded?2:0);s.cash-=direct+extra;notes.push('受注成功。'+c.j.name+'の売上を計上。');if(overloaded)notes.push('制作能力を超過し、緊急外注35万円と信用低下が発生。');notes.push(event.desc)}else{trustDelta=-1;notes.push('見積価格が顧客の許容範囲を超え失注。売上0円、固定費は発生。')}
s.team+=draft.staff;const fixed=s.overhead+s.founderPay+s.team*s.staffPay;const hireCost=draft.staff*8;const interest=Math.round(s.loan*s.loanRate/12*100)/100;s.cash-=fixed+hireCost+interest;const operating=revenue-direct-extra-fixed-hireCost;const net=operating-interest;s.profit+=operating;s.retained+=net;s.trust=Math.max(0,Math.min(20,s.trust+trustDelta));const endCash=s.cash;const failure=endCash<0;const record={month:s.month,job:c.j.name,quoted:draft.price,win,startCash,due,deposit,loan:approvedLoan,revenue,direct,extra,fixed,hireCost,interest,operating,net,endCash,receivable:s.receivables.reduce((a,x)=>a+x.amount,0),trust:s.trust,team:s.team,notes,overloaded,priceRatio};s.records.push(record);const problems=[];const good=[];if(win)good.push('案件を受注し、売上と売掛金を正しく計上できました。');if(deposit>0)good.push('前受金を交渉して、先行支出の一部を回収できました。');if(endCash>=150)good.push('月末現金に一定の余裕を確保しました。');if(!win)problems.push('市場価格を上回る見積もりで失注。顧客価値と価格の整合性を再検討。');if(overloaded&&win)problems.push('案件規模に対して人員不足。外注計画か案件規模の見直しが必要。');if(endCash<150)problems.push('資金余力が小さい。入金前倒し・費用削減・適正な融資を検討。');if(approvedLoan<draft.loan)problems.push('信用不足により融資が否決。資金調達を確実視してはいけません。');if(net<0)problems.push('当期純損益が赤字。粗利と固定費の関係を確認。');if(draft.staff>0&&c.j.days<=s.team)problems.push('採用による固定費増加が案件規模に見合うか再検討。');if(!problems.length)problems.push('大きな問題はありません。ただし顧客集中と翌月の売掛金回収に注意。');let score=50+(win?15:-20)+(deposit>0?10:0)+(endCash>=150?15:endCash>=0?0:-35)+(net>0?10:-10)-(overloaded&&win?15:0)-(approvedLoan<draft.loan?10:0);score=Math.max(0,Math.min(100,score));feedback={record,good,problems,score,failure};s.month++;if(failure||s.month>12)s.ended=true;save();tab='review';render()}
function review(){if(!feedback){return `<section class="panel"><h2>経営フィードバック</h2><p>1か月経営すると、ここに採点と決算が表示されます。</p></section>`}const f=feedback,r=f.record;return `<div class="cols"><section class="panel"><div class="pill" style="display:inline-block">MONTH ${r.month} RESULT</div><h1>経営診断：${f.score} / 100点</h1><div class="bar"><span style="width:${f.score}%"></span></div><p class="muted">これは教育用の経営判断スコア。実際の企業価値評価ではありません。</p><h3>良かった点</h3>${f.good.map(x=>`<div class="notice green">✓ ${esc(x)}</div>`).join('')||'<p>今回の判断で強みを発揮できた点を探してみましょう。</p>'}<h3>改善が必要な点</h3>${f.problems.map(x=>`<div class="notice">⚠ ${esc(x)}</div>`).join('')}<h3>実務上の考え方</h3><p>経営判断は①利益が残るか、②支払い日に現金があるか、③制作能力を超えていないか、④取引先の信用を維持できるか、の4つを同時に見る必要があります。</p><div class="actions"><button onclick="tab='play';feedback=null;render()">${s.ended?'最終結果を見る':'次の月へ進む →'}</button><button class="secondary" onclick="tab='ledger';render()">決算書を見る</button></div></section><section class="panel"><h2>${r.month}か月目の月次決算</h2><table><tr><td>売上高</td><td>${yen(r.revenue)}</td></tr><tr><td>直接制作費</td><td>−${yen(r.direct)}</td></tr><tr><td>突発費用</td><td>−${yen(r.extra)}</td></tr><tr><td>固定費・採用費</td><td>−${yen(r.fixed+r.hireCost)}</td></tr><tr><th>営業利益</th><th>${yen(r.operating)}</th></tr><tr><td>支払利息</td><td>−${yen(r.interest)}</td></tr><tr><th>税引前利益</th><th>${yen(r.net)}</th></tr></table><h3 style="margin-top:20px">現金の動き</h3><table><tr><td>期首現金</td><td>${yen(r.startCash)}</td></tr><tr><td>過去の売掛金回収</td><td>＋${yen(r.due)}</td></tr><tr><td>前受金</td><td>＋${yen(r.deposit)}</td></tr><tr><td>新規融資</td><td>＋${yen(r.loan)}</td></tr><tr><td>制作・運営・利息</td><td>−${yen(r.direct+r.extra+r.fixed+r.hireCost+r.interest)}</td></tr><tr><th>期末現金</th><th class="${r.endCash<0?'red':''}">${yen(r.endCash)}</th></tr></table><hr class="separator"><h3>発生した出来事</h3>${r.notes.map(x=>`<p class="muted">• ${esc(x)}</p>`).join('')}${f.failure?'<div class="tip warning">資金ショート。追加資金なしでは支払いができません。ゲームオーバーです。</div>':''}</section></div>`}
function ledger(){const rows=s.records;const cash=s.cash;const ar=s.receivables.reduce((a,x)=>a+x.amount,0);const assets=cash+ar;const liabilities=s.loan;const equity=assets-liabilities;return `<div class="cols"><section class="panel"><h2>簡易貸借対照表（BS）</h2><p class="muted">期末時点。売掛金は翌月以降の回収予定額。現金がマイナスのときは支払不能状態を表します。</p><table><tr><td>現金</td><td>${yen(cash)}</td></tr><tr><td>売掛金</td><td>${yen(ar)}</td></tr><tr><th>資産合計</th><th>${yen(assets)}</th></tr><tr><td>借入金</td><td>${yen(liabilities)}</td></tr><tr><td>資本金＋累計損益（概算）</td><td>${yen(equity)}</td></tr><tr><th>負債・純資産合計</th><th>${yen(liabilities+equity)}</th></tr></table><p class="mini">資本金500万円と税引前損益の累計を基礎とする簡易モデル。未払税金、減価償却、消費税、社会保険の詳細、融資返済は未実装。</p></section><section class="panel"><h2>月次PL・資金推移</h2><div class="scroll"><table><tr><th>月</th><th>売上</th><th>営業利益</th><th>現金</th></tr>${rows.map(r=>`<tr><td>${r.month}</td><td>${yen(r.revenue)}</td><td>${yen(r.operating)}</td><td>${yen(r.endCash)}</td></tr>`).join('')}</table></div><button class="secondary" style="margin-top:16px" onclick="exportCSV()">決算データをCSV保存</button></section></div>`}
function ending(){const won=s.records.filter(r=>r.win).length;const success=s.cash>=0;return `<section class="panel"><div class="pill" style="display:inline-block">FINAL REPORT</div><h1>${success?'12か月経営完走！':'資金ショート：経営継続困難'}</h1><p>受注 ${won}件 / 経営 ${s.records.length}か月。期末現金 <b>${yen(s.cash)}</b>、累計営業利益 <b>${yen(s.profit)}</b>、借入残高 <b>${yen(s.loan)}</b>。</p><div class="tip">${success?'会社は存続しました。ただし、翌月の売掛金回収・固定費・税金への備えが必要です。':'利益と資金繰りは別物。次回は前受金、案件規模、固定費、資金調達を見直しましょう。'}</div><div class="actions"><button onclick="tab='ledger';render()">最終決算を確認</button><button class="secondary" onclick="restartConfirm()">別の戦略で再挑戦</button></div></section>`}
function exportCSV(){const heads=['month','job','quoted','won','revenue','direct_cost','extra_cost','fixed_cost','hiring_cost','interest','operating_profit','net_before_tax','cash_end','receivables_end','loan_new','trust'];const data=[heads.join(','),...s.records.map(r=>[r.month,'"'+r.job+'"',r.quoted,r.win,r.revenue,r.direct,r.extra,r.fixed,r.hireCost,r.interest,r.operating,r.net,r.endCash,r.receivable,r.loan,r.trust].join(','))].join('\r\n');const blob=new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ceolab_financials.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){const app=document.getElementById('app');if(!s.started){app.innerHTML=intro();return}app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px"><div><h1 style="margin:0">経営ダッシュボード</h1><div class="muted">${s.ended?'経営終了':'経営 '+s.month+'か月目'} · 社員 ${s.team}名 · 顧客信用 ${s.trust}/20</div></div><span class="pill">自動保存</span></div>${stat()}<div class="tabbar"><button class="tab ${tab==='play'?'active':''}" onclick="tab='play';render()">経営判断</button><button class="tab ${tab==='review'?'active':''}" onclick="tab='review';render()">経営診断</button><button class="tab ${tab==='ledger'?'active':''}" onclick="tab='ledger';render()">決算書</button></div>${tab==='play'?play():tab==='review'?review():ledger()}<div class="footer">CEO LAB v1.0 — 教育用シミュレーション。架空の取引先と金額を使用。簡易化されたモデルであり、専門的な税務・法務・会計・投資助言ではありません。進捗はこのブラウザのローカル保存領域に保存されます。</div>`}
render();</script></body></html>
